<section id="sectionH">
    <h2>H – Diagram</h2>

    <div class="text-box">
        <p>
            Diagrammet visar hur många personer som besökt sporthallen, badhuset,
            museet och biblioteket under åren 2022, 2023 och 2024.
        </p>
    </div>

    <!-- Chart.js canvas (must exist before initChart runs) -->
    <canvas id="diagramChart" height="120"></canvas>

    <!-- Question H.1 -->
    <div class="question">
        <div class="question-title">H.1 Hur många besökte badhuset 2024?</div>
        <label><input type="radio" name="q_H_1" value="0"> 5000</label>
        <label><input type="radio" name="q_H_1" value="1"> 6000</label>
        <label><input type="radio" name="q_H_1" value="2"> 7000</label>
        <label><input type="radio" name="q_H_1" value="3"> 8000</label>
    </div>

    <!-- Question H.2 -->
    <div class="question">
        <div class="question-title">H.2 Vilken plats hade samma antal 2022 och 2024?</div>
        <label><input type="radio" name="q_H_2" value="0"> Sporthall</label>
        <label><input type="radio" name="q_H_2" value="1"> Badhus</label>
        <label><input type="radio" name="q_H_2" value="2"> Museum</label>
        <label><input type="radio" name="q_H_2" value="3"> Bibliotek</label>
    </div>
</section>
